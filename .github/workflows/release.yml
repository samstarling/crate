name: Release

# On every merge to main, semantic-release works out the next version from the Conventional
# Commits since the last tag, then creates the tag and a GitHub Release with generated notes.
# If it released, the build job attaches a signed, notarized app. (Both live in one workflow
# because releases made with GITHUB_TOKEN don't trigger other workflows.)
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes semantic-release@24

      # semantic-release tags HEAD when it releases; no tag means nothing was releasable.
      - name: Find the new tag
        id: tag
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.tag_name != ''
    runs-on: macos-26
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag_name }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      # The runner context isn't available in job-level env, so temp paths are set here.
      - name: Set paths
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install signing certificate and notary key
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -t cert -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$ASC_API_KEY_PATH"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Crate.xcodeproj \
            -scheme Crate \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Crate.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Export with Developer ID
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Crate.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/Crate.app"

      - name: Notarize and staple the app
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Crate.app" "$RUNNER_TEMP/Crate-notarize.zip"
          scripts/notarize.sh "$RUNNER_TEMP/Crate-notarize.zip"
          xcrun stapler staple "$RUNNER_TEMP/export/Crate.app"

      - name: Package zip and DMG
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Crate.app" "dist/Crate-$VERSION.zip"

          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R "$RUNNER_TEMP/export/Crate.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Crate" -srcfolder "$staging" -fs HFS+ -format UDZO "dist/Crate-$VERSION.dmg"
          codesign --sign "Developer ID Application" --keychain "$KEYCHAIN" --timestamp "dist/Crate-$VERSION.dmg"

      - name: Notarize and staple the DMG
        run: |
          scripts/notarize.sh "dist/Crate-$VERSION.dmg"
          xcrun stapler staple "dist/Crate-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature --verbose "dist/Crate-$VERSION.dmg"

      # The appcast is uploaded with the release, and the app's SUFeedURL points at
      # releases/latest/download/appcast.xml, so each release's appcast replaces the last.
      - name: Generate Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          updates="$RUNNER_TEMP/updates"
          mkdir -p "$updates"
          cp "dist/Crate-$VERSION.zip" "$updates/"
          gh release view "$TAG" --json body --jq .body > "$updates/Crate-$VERSION.md"

          echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --embed-release-notes \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
            "$updates"
          cat dist/appcast.xml

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$ASC_API_KEY_PATH"
